name: 실험실 배포
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: 화면 파일 받기
        run: |
          set -e
          export $(grep -v '^#' sources.txt | xargs)
          mkdir -p site
          curl -fsSL -o site/index.html "https://drive.usercontent.google.com/download?id=${INDEX_ID}&export=download&confirm=t"
          curl -fsSL -o site/og.png "https://drive.usercontent.google.com/download?id=${OG_ID}&export=download&confirm=t"
          grep -q "windlab-v3" site/index.html
          file site/og.png | grep -q PNG
          if [ -n "${FIGS_ID:-}" ]; then
            curl -fsSL -o figs.zip "https://drive.usercontent.google.com/download?id=${FIGS_ID}&export=download&confirm=t"
            mkdir -p site/figs && unzip -q -o figs.zip -d site/figs && ls site/figs | wc -l
          fi
          touch site/.nojekyll
          ls -la site
      - uses: actions/upload-pages-artifact@v4
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v4
